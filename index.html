<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Mang Emong Ramen Finance</title>
  <link rel="apple-touch-icon" sizes="180x180" href="https://mangemong.netlify.app/img/logo.png">
  <link rel="icon" type="image/png" href="https://mangemong.netlify.app/img/logo.png">
  
  <!-- Google Fonts & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .login-card {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .login-header img {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 12px;
      border: 2px solid #38bdf8;
    }
    .login-header h2 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #f8fafc;
    }
    .login-header p {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      color: #cbd5e1;
    }
    .input-wrapper {
      position: relative;
    }
    .input-wrapper i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 14px;
    }
    .form-group input {
      width: 100%;
      padding: 10px 12px 10px 36px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f8fafc;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      border-color: #38bdf8;
    }
    .btn-login {
      width: 100%;
      padding: 12px;
      background: #0284c7;
      border: none;
      border-radius: 8px;
      color: #ffffff;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }
    .btn-login:hover {
      background: #0369a1;
    }
    .btn-login:disabled {
      background: #475569;
      cursor: not-allowed;
    }
    .error-msg {
      color: #f87171;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }
  </style>

  <!-- Firebase SDK (Compat Version) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <img src="./img/logo.jpg" alt="Logo Mang Emong">
      <h2>Mang Emong Finance</h2>
      <p>Masuk ke sistem keuangan & kasir</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="email" placeholder="nama@ramenhouse.com" required>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Kata Sandi</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" id="btnLogin" class="btn-login">Masuk ke Sistem</button>
      <p id="errorMsg" class="error-msg"></p>
    </form>
  </div>

  <!-- Script Konfigurasi & Logika Login Firebase -->
  <script src="js/firebase-config.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btnLogin = document.getElementById('btnLogin');
      const errorMsg = document.getElementById('errorMsg');

      errorMsg.style.display = 'none';
      btnLogin.disabled = true;
      btnLogin.innerText = 'Memverifikasi...';

      // 1. Authenticate user dengan Firebase Auth
      firebase.auth().signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
          const uid = userCredential.user.uid;

          // 2. Ambil data role dari Realtime Database
          return firebase.database().ref('users/' + uid).once('value');
        })
        .then((snapshot) => {
          if (snapshot.exists()) {
            const userData = snapshot.val();
            
            // Simpan role di localStorage agar bisa dibaca di dashboard
            localStorage.setItem('userRole', userData.role || 'kasir');
            localStorage.setItem('userName', userData.nama || 'User');

            // 3. Arahkan ke dashboard utama
            window.location.href = 'dashboard.html';
          } else {
            throw new Error('Data profil akun tidak ditemukan di database.');
          }
        })
        .catch((error) => {
          errorMsg.innerText = 'Gagal Login: ' + error.message;
          errorMsg.style.display = 'block';
          btnLogin.disabled = false;
          btnLogin.innerText = 'Masuk ke Sistem';
        });
    });
  </script>
</body>
</html>
