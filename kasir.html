<!DOCTYPE html>
<html lang="id">
<head>
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MANG EMOS FINANCE - Admin Dashboard</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] } } }
    }
  </script>

  <!-- Firebase SDK Compat Lengkap (App, Auth, Firestore, & Realtime Database) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <!-- XLSX & PDF Libs (Khusus Dashboard Admin) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
</head>
  <!-- Top Nav -->
  <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <span class="text-2xl">🍜</span>
      <div>
        <h1 class="font-bold text-white text-lg">MANG EMOS FINANCE</h1>
        <p class="text-xs text-emerald-400 font-semibold">● Mode Kasir Shift Active</p>
      </div>
    </div>
    <button onclick="logout()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs px-4 py-2 rounded-lg font-semibold">
      Keluar / Logout
    </button>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-6 space-y-6">
    <!-- Form Input Pemasukan -->
    <section class="bg-slate-800 rounded-2xl p-6 border border-slate-700 shadow-xl">
      <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
        <span>💰</span> Input Uang Masuk & Penjualan
      </h2>
      <form id="kasirIncomeForm" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold mb-1 text-slate-400">Metode Pembayaran</label>
            <select id="kasirPaymentMethod" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white">
              <option value="Tunai">Tunai / Cash (Laci)</option>
              <option value="QRIS">Non-Tunai (QRIS)</option>
              <option value="Transfer">Non-Tunai (Transfer Bank)</option>
              <option value="Debit">Non-Tunai (Kartu Debit)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1 text-slate-400">Nominal Uang Masuk (Rp)</label>
            <input type="number" id="kasirAmount" required placeholder="Contoh: 150000" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1 text-slate-400">Keterangan Produk Terjual (Manual)</label>
          <textarea id="kasirItems" required rows="2" placeholder="Contoh: Mie Ramen 3 mangkok, Es Teh 3 gelas" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white"></textarea>
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-3 rounded-xl shadow-lg shadow-emerald-600/30 transition">
          Simpan Transaksi Pemasukan
        </button>
      </form>
    </section>

    <!-- Closing Shift & Cash Variance -->
    <section class="bg-slate-800 rounded-2xl p-6 border border-slate-700 shadow-xl space-y-4">
      <h2 class="text-lg font-bold text-white flex items-center gap-2">
        <span>🔒</span> Proses Closing Shift (Audit Laci Kas)
      </h2>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-900 p-4 rounded-xl border border-slate-700">
        <div>
          <p class="text-xs text-slate-400">Total Akumulasi System (Tunai):</p>
          <p class="text-2xl font-extrabold text-emerald-400" id="systemCashDisplay">Rp 0</p>
        </div>
        <div>
          <p class="text-xs text-slate-400">Total Non-Tunai Shift Ini:</p>
          <p class="text-xl font-bold text-indigo-400" id="systemNonCashDisplay">Rp 0</p>
        </div>
      </div>

      <div class="space-y-2">
        <label class="block text-xs font-semibold text-slate-400">Input Fisik Uang Tunai di Laci (Rp)</label>
        <input type="number" id="physicalCashInput" placeholder="Masukkan total hitungan uang kertas/koin di laci" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white">
      </div>

      <button type="button" onclick="calculateVariance()" class="w-full bg-slate-700 hover:bg-slate-600 font-semibold py-2.5 rounded-xl transition">
        Cek Selisih Kas (Audit Variance)
      </button>

      <!-- Audit Output -->
      <div id="auditBox" class="hidden p-4 rounded-xl border text-center space-y-1">
        <p class="text-sm font-semibold" id="auditTitle">Status Audit: -</p>
        <p class="text-xl font-bold" id="auditDiff">Rp 0</p>
      </div>

      <button type="button" onclick="processClosingShift()" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-3 rounded-xl shadow-lg shadow-indigo-600/30 transition">
        Selesaikan & Closing Shift (Reset Kas ke 0)
      </button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
